<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公式 AST 语法树解析</title>

    <!-- KaTeX 数学排版引擎 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>

    <!-- MathLive: 所见即所得数学公式排版与交互输入引擎 (先行载入自定义元素) -->
    <script defer src="https://cdn.jsdelivr.net/npm/mathlive"></script>
    <script>
        // MathLive CDN 容灾降级检测：若 jsdelivr 源未就绪则动态降级拉取 unpkg 备用源
        window.addEventListener('error', function (e) {
            if (e.target && e.target.tagName === 'SCRIPT' && e.target.src && e.target.src.includes('cdn.jsdelivr.net/npm/mathlive')) {
                console.warn('Jsdelivr MathLive 加载异常，正在尝试 unpkg 备用源...');
                var fb = document.createElement('script');
                fb.defer = true;
                fb.src = 'https://unpkg.com/mathlive';
                document.head.appendChild(fb);
            }
        }, true);
    </script>

    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f1f5f9;
            display: flex;
            justify-content: center;
            padding-top: 50px;
            padding-bottom: 50px;
        }

        .card {
            background: #ffffff;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 640px;
        }

        /* 固定输入框大小与外观美化 */
        math-field {
            display: block;
            width: 100%;
            box-sizing: border-box;
            min-height: 64px;
            font-size: 1.6rem;
            padding: 12px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            --primary: #38bdf8;
            --caret-color: #38bdf8;
        }

        math-field:focus-within {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }

        /* 底部展示框样式，保留格式 */
        .output-box {
            margin-top: 20px;
            background: #1e293b;
            color: #a78bfa;
            padding: 16px;
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            word-wrap: break-word;
            min-height: 100px;
            white-space: pre-wrap;
            overflow-y: auto;
        }

        /* 可折叠 AST 语法树样式 */
        .ast-collapsible {
            margin-top: 20px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background: #f8fafc;
            overflow: hidden;
            transition: all 0.2s ease;
        }

        .ast-collapsible summary {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            font-size: 0.9rem;
            color: #64748b;
            font-weight: 500;
            cursor: pointer;
            user-select: none;
            list-style: none;
            transition: background-color 0.15s ease, color 0.15s ease;
        }

        .ast-collapsible summary::-webkit-details-marker {
            display: none;
        }

        .ast-collapsible summary:hover {
            background-color: #f1f5f9;
            color: #334155;
        }

        .ast-collapsible summary .collapse-icon {
            font-size: 0.75rem;
            color: #94a3b8;
            transition: transform 0.2s ease;
        }

        .ast-collapsible[open] summary .collapse-icon {
            transform: rotate(180deg);
        }

        .ast-collapsible .output-box {
            margin: 0;
            border-top: 1px solid #334155;
            border-radius: 0 0 8px 8px;
            max-height: 280px;
        }

        /* 推导步骤样式 */
        .step-item {
            margin-top: 6px;
        }

        .step-item-title {
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 4px;
        }

        .step-item math-field {
            background: #1e293b;
            color: #38bdf8;
            min-height: 48px;
            font-size: 1.3rem;
            border: 1px solid #334155;
            border-radius: 8px;
        }

        /* KaTeX 公式在图例与图像浮窗中的优化排版 */
        #graph-legend .katex {
            font-size: 1.05em;
            color: #f8fafc;
        }

        #graph-tooltip .katex {
            font-size: 1.15em;
            color: #38bdf8;
        }

        #graph-tooltip .katex-html,
        #graph-legend .katex-html {
            white-space: nowrap;
        }

        /* 快捷数学键栏与工具栏 */
        .pc-quick-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
            margin-bottom: 8px;
        }

        .quick-btn {
            padding: 6px 10px;
            background: #f8fafc;
            color: #334155;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.85rem;
            font-family: 'JetBrains Mono', system-ui, sans-serif;
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
        }

        .quick-btn:hover {
            background: #e2e8f0;
            border-color: #94a3b8;
            color: #0f172a;
        }

        .quick-btn:active {
            transform: scale(0.95);
        }

        .quick-btn.btn-action {
            color: #ef4444;
            background: #fef2f2;
            border-color: #fecaca;
        }

        .quick-btn.btn-action:hover {
            background: #fee2e2;
            border-color: #fca5a5;
        }

        .quick-btn.btn-keyboard {
            color: #0284c7;
            background: #f0f9ff;
            border-color: #bae6fd;
            font-weight: 500;
        }

        .quick-btn.btn-keyboard:hover {
            background: #e0f2fe;
            border-color: #7dd3fc;
        }

        /* 预设示例标签 */
        .presets-row {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 4px;
            margin-bottom: 12px;
            font-size: 0.82rem;
            color: #64748b;
        }

        .preset-badge {
            padding: 2px 8px;
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            border-radius: 4px;
            cursor: pointer;
            color: #475569;
            transition: all 0.15s ease;
            user-select: none;
        }

        .preset-badge:hover {
            background: #e0f2fe;
            color: #0369a1;
            border-color: #bae6fd;
        }
    </style>
</head>

<body>

    <div class="card">
        <h3 style="margin-top: 0; color: #334155;">公式输入框</h3>

        <!-- 输入框展示与交互配置 (预置示例公式，确保DOM解析即刻可交互) -->
        <math-field id="myMathInput" math-virtual-keyboard-policy="auto">x^2 - 4 = 0</math-field>

        <!-- 快捷数学键栏与虚拟键盘开关 -->
        <div class="pc-quick-toolbar">
            <button class="quick-btn btn-keyboard" id="btnToggleKeyboard" title="展开/收起 MathLive 虚拟数学键盘">⌨️ 虚拟键盘</button>
            <button class="quick-btn" data-insert="x">x</button>
            <button class="quick-btn" data-insert="y">y</button>
            <button class="quick-btn" data-insert="+">+</button>
            <button class="quick-btn" data-insert="-">-</button>
            <button class="quick-btn" data-insert="\cdot">×</button>
            <button class="quick-btn" data-insert="\frac{#?}{#?}">÷</button>
            <button class="quick-btn" data-insert="^2">x²</button>
            <button class="quick-btn" data-insert="^{#?}">xʸ</button>
            <button class="quick-btn" data-insert="\sqrt{#?}">√</button>
            <button class="quick-btn" data-insert="\int #? dx">∫</button>
            <button class="quick-btn" data-insert="\int_{#?}^{#?} #? dx">∫ₐᵇ</button>
            <button class="quick-btn" data-insert="\lim_{x \to 0} #?">lim</button>
            <button class="quick-btn" data-insert="\frac{d}{dx}\left(#?\right)">d/dx</button>
            <button class="quick-btn" data-insert="\sin\left(#?\right)">sin</button>
            <button class="quick-btn" data-insert="\cos\left(#?\right)">cos</button>
            <button class="quick-btn" data-insert="\ln\left(#?\right)">ln</button>
            <button class="quick-btn" data-insert="\pi">π</button>
            <button class="quick-btn" data-insert="e">e</button>
            <button class="quick-btn" data-insert="\left(#?\right)">( )</button>
            <button class="quick-btn btn-action" id="btnBackspace" title="退格删除">⌫ 退格</button>
            <button class="quick-btn btn-action" id="btnClear" title="清空输入框">清空</button>
        </div>

        <!-- 常用示例预设 -->
        <div class="presets-row">
            <span>快捷示例：</span>
            <span class="preset-badge" data-formula="x^2 - 4 = 0">方程求解</span>
            <span class="preset-badge" data-formula="\int x \sin(x) dx">分部积分</span>
            <span class="preset-badge" data-formula="\int_{0}^{1} x^2 dx">定积分</span>
            <span class="preset-badge" data-formula="\lim_{x \to 0} \frac{\sin x}{x}">极限计算</span>
            <span class="preset-badge" data-formula="f(x) = x^3 - 3x">函数分析</span>
            <span class="preset-badge" data-formula="y' + 2y = 4x">微分方程</span>
        </div>

        <!-- 可折叠 AST 语法树结构展示区 -->
        <details class="ast-collapsible">
            <summary>
                <span>AST 语法树结构 (MathJSON)</span>
                <span class="collapse-icon">▼</span>
            </summary>
            <div class="output-box" id="ASTOutput">Loading...</div>
        </details>

        <!-- 计算触发与结果展示 -->
        <button id="calcBtn"
            style="margin-top: 16px; padding: 10px 20px; background: #38bdf8; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600;">开始分步计算</button>

        <div style="margin-top: 16px; color: #64748b; font-size: 0.9rem;">最终计算结果：</div>
        <math-field id="resultOutput" readonly style="background: #1e293b; color: #ffffff;">等待计算...</math-field>

        <div style="margin-top: 16px; color: #64748b; font-size: 0.9rem;">函数图像与几何特征：</div>
        <div id="graphContainer" style="margin-top: 8px;"></div>

        <div style="margin-top: 16px; color: #64748b; font-size: 0.9rem;">推导步骤：</div>
        <div id="stepsContainer" style="display: flex; flex-direction: column; gap: 10px; margin-top: 8px;"></div>
    </div>

    <!-- 基础交互逻辑：即时响应快捷符号、虚拟键盘、清空与退格（完全兼容 file:// 与无网络离线环境） -->
    <script>
        (function() {
            const mathInput = document.getElementById('myMathInput');
            const calcBtn = document.getElementById('calcBtn');

            // 快捷数学按键输入绑定
            document.querySelectorAll('.quick-btn[data-insert]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    const latex = btn.getAttribute('data-insert');
                    mathInput.focus();
                    if (typeof mathInput.executeCommand === 'function') {
                        mathInput.executeCommand(['insert', latex]);
                    } else {
                        mathInput.value = (mathInput.value || '') + latex;
                        mathInput.dispatchEvent(new Event('input', { bubbles: true }));
                    }
                });
            });

            // 虚拟键盘开关
            const btnToggleKeyboard = document.getElementById('btnToggleKeyboard');
            if (btnToggleKeyboard) {
                btnToggleKeyboard.addEventListener('click', (e) => {
                    e.preventDefault();
                    mathInput.focus();
                    if (window.mathVirtualKeyboard) {
                        if (window.mathVirtualKeyboard.visible) {
                            window.mathVirtualKeyboard.hide();
                        } else {
                            window.mathVirtualKeyboard.show();
                        }
                    }
                });
            }

            // 清空与退格
            document.getElementById('btnClear')?.addEventListener('click', (e) => {
                e.preventDefault();
                mathInput.value = '';
                mathInput.focus();
                mathInput.dispatchEvent(new Event('input', { bubbles: true }));
            });

            document.getElementById('btnBackspace')?.addEventListener('click', (e) => {
                e.preventDefault();
                mathInput.focus();
                if (typeof mathInput.executeCommand === 'function') {
                    mathInput.executeCommand('deleteBackward');
                } else {
                    mathInput.value = (mathInput.value || '').slice(0, -1);
                    mathInput.dispatchEvent(new Event('input', { bubbles: true }));
                }
            });

            // 预设示例点击快捷填充
            document.querySelectorAll('.preset-badge[data-formula]').forEach(badge => {
                badge.addEventListener('click', (e) => {
                    e.preventDefault();
                    const formula = badge.getAttribute('data-formula');
                    mathInput.value = formula;
                    mathInput.focus();
                    mathInput.dispatchEvent(new Event('input', { bubbles: true }));
                    calcBtn?.click();
                });
            });
        })();
    </script>

    <!-- 使用 ES Module 现代模块化方式引入分步求解与 2D 绘图引擎 -->
    <script type="module">
        import { routeCalculation } from './router.js';
        import { InteractiveGrapher } from './grapher.js';

        const mathInput = document.getElementById('myMathInput');
        const ASTOutput = document.getElementById('ASTOutput');
        const calcBtn = document.getElementById('calcBtn');
        const resultOutput = document.getElementById('resultOutput');
        const stepsContainer = document.getElementById('stepsContainer');
        const grapher = new InteractiveGrapher('graphContainer');

        let ce = null;

        function updateAST() {
            let mathJSON = null;
            try {
                if (mathInput.expression && mathInput.expression.json) {
                    mathJSON = mathInput.expression.json;
                } else if (typeof mathInput.getValue === 'function') {
                    mathJSON = mathInput.getValue('math-json');
                }
            } catch (e) {
                mathJSON = { error: e.message };
            }

            if (typeof mathJSON === 'string') {
                try { mathJSON = JSON.parse(mathJSON); } catch (e) { }
            }

            ASTOutput.textContent = mathJSON ? JSON.stringify(mathJSON, null, 2) : '等待输入有效公式...';
        }

        mathInput.addEventListener('input', updateAST);

        // 后台异步无阻塞加载 ComputeEngine 与 MathLive ES 模块 (双源容灾降级)
        async function loadComputeEngine() {
            let MathfieldElement = window.MathfieldElement;
            if (!MathfieldElement) {
                try {
                    const ml = await import('https://cdn.jsdelivr.net/npm/mathlive/+esm');
                    MathfieldElement = ml.MathfieldElement;
                } catch (e1) {
                    try {
                        const ml = await import('https://unpkg.com/mathlive?module');
                        MathfieldElement = ml.MathfieldElement;
                    } catch (e2) { }
                }
            }

            let ComputeEngineClass = null;
            try {
                const ceModule = await import('https://cdn.jsdelivr.net/npm/@cortex-js/compute-engine/+esm');
                ComputeEngineClass = ceModule.ComputeEngine;
            } catch (e1) {
                console.warn('Jsdelivr ComputeEngine 模块加载失败，切换至 unpkg...', e1);
                try {
                    const ceModule = await import('https://unpkg.com/@cortex-js/compute-engine?module');
                    ComputeEngineClass = ceModule.ComputeEngine;
                } catch (e2) {
                    console.error('所有 CDN 载入 ComputeEngine 均失败:', e2);
                }
            }

            if (ComputeEngineClass) {
                ce = new ComputeEngineClass();
                if (MathfieldElement) {
                    MathfieldElement.computeEngine = ce;
                }
                updateAST();
            }
            return ce;
        }

        const ceLoadingPromise = loadComputeEngine();

        // 立即展示一次默认 AST
        updateAST();

        // 3. 计算与渲染逻辑
        calcBtn.addEventListener('click', async () => {
            if (!ce) {
                resultOutput.value = "计算引擎载入中，请稍候...";
                await ceLoadingPromise;
            }

            let currentAST = null;
            try {
                if (mathInput.expression && mathInput.expression.json) {
                    currentAST = mathInput.expression.json;
                } else if (typeof mathInput.getValue === 'function') {
                    currentAST = mathInput.getValue('math-json');
                }
                if (typeof currentAST === 'string') {
                    try { currentAST = JSON.parse(currentAST); } catch (e) { }
                }
            } catch (e) { }

            if (!currentAST || currentAST === 'Nothing') {
                resultOutput.value = "请输入有效的公式";
                return;
            }

            // 调用路由器分发任务
            const output = routeCalculation(currentAST, ce);

            // 渲染最终结果
            resultOutput.value = output.resultLatex;

            // 动态生成可视化的推导步骤 (采用和结果一致的 math-field 组件)
            stepsContainer.innerHTML = '';
            if (output.steps && output.steps.length > 0) {
                output.steps.forEach(step => {
                    const stepItem = document.createElement('div');
                    stepItem.className = 'step-item';

                    const label = document.createElement('div');
                    label.className = 'step-item-title';
                    label.textContent = step.title;

                    const stepField = document.createElement('math-field');
                    stepField.setAttribute('readonly', '');
                    stepField.style.cssText = "background: #1e293b; color: #38bdf8; min-height: 48px; font-size: 1.3rem;";
                    stepField.value = step.latex;

                    stepItem.appendChild(label);
                    stepItem.appendChild(stepField);
                    stepsContainer.appendChild(stepItem);
                });
            }

            // 联动更新 2D 交互画布
            if (output.plotData) {
                grapher.setData(output.plotData);
            } else {
                grapher.setData(null);
            }
        });
    </script>

</body>

</html>
