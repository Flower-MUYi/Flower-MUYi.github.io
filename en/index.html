<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowerMUYi Navigation Portal | Redirecting</title>
    <meta http-equiv="refresh" content="0; url=../pc/index.html">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <style>
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .loader-card {
            background: #161f30;
            padding: 40px;
            border-radius: 16px;
            border: 1px solid #23324a;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 90%;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(59, 130, 246, 0.2);
            border-left-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h2 { margin: 0 0 10px 0; font-size: 1.4rem; color: #60a5fa; }
        p { color: #94a3b8; font-size: 0.95rem; margin-bottom: 24px; }
        .lang-btn {
            padding: 10px 20px;
            background: #3b82f6;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
        }
    </style>
    <script>
        (function() {
            try {
                localStorage.removeItem('preferred_lang');
            } catch(e) {}
            window.location.replace('../pc/index.html');
        })();
    </script>
</head>
<body>
    <div class="loader-card">
        <div class="spinner"></div>
        <h2>FlowerMUYi Navigation Portal</h2>
        <p>Redirecting to the portal studio...</p>
        <a href="../pc/index.html" class="lang-btn">Enter Portal</a>
    </div>
</body>
</html>
