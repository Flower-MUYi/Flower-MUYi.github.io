<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>科学微积分计算器 | 手机工作台</title>
    <meta name="description" content="FlowerMUYi 移动端科学计算器：支持不定积分、定积分、极限、导数分步推导与交互式 2D 函数图像分析。">

    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        (function () {
            var t = localStorage.getItem('flowermuyi_theme') || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>

    <style>
        :root {
            --primary: #38bdf8;
            --primary-hover: #0ea5e9;
            --bg-main: #0b0f19;
            --bg-card: #131d2e;
            --bg-card-sec: #19263c;
            --border: #22324d;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --radius: 12px;
            --safe-bottom: env(safe-area-inset-bottom, 12px);
        }

        [data-theme="light"] {
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --bg-card-sec: #f1f5f9;
            --border: #cbd5e1;
            --text-main: #0f172a;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            transition: background-color 0.25s, color 0.25s;
        }

        /* 顶部导航栏 */
        .mobile-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(19, 29, 46, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        [data-theme="light"] .mobile-header {
            background: rgba(255, 255, 255, 0.9);
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-main);
            font-weight: 700;
            font-size: 0.95rem;
        }

        .brand-badge {
            width: 32px;
            height: 32px;
            background: var(--bg-card-sec);
            border: 1px solid var(--border);
            color: var(--primary);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
        }

        .h-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            width: 34px;
            height: 34px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.95rem;
            touch-action: manipulation;
        }

        .container {
            padding: 12px;
            width: 100%;
            max-width: 580px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding-bottom: calc(20px + var(--safe-bottom));
        }

        .card {
            background: var(--bg-card);
            padding: 16px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
        }

        /* 标题标签 */
        .section-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* 输入框样式 */
        math-field {
            display: block;
            width: 100%;
            box-sizing: border-box;
            min-height: 58px;
            font-size: 1.45rem;
            padding: 10px 12px;
            background: #0f172a;
            color: #f8fafc;
            border: 1.5px solid #334155;
            border-radius: 10px;
            outline: none;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            transition: border-color 0.2s, box-shadow 0.2s;
            --primary: #38bdf8;
            --caret-color: #38bdf8;
        }

        math-field:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
        }

        [data-theme="light"] math-field {
            background: #ffffff;
            color: #0f172a;
            border-color: #cbd5e1;
        }

        /* 移动端快捷符号工具栏 */
        .quick-toolbar-wrapper {
            margin-top: 8px;
            position: relative;
        }

        .quick-toolbar {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding: 4px 2px;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-x;
        }

        .quick-toolbar::-webkit-scrollbar {
            display: none;
        }

        .quick-btn {
            flex-shrink: 0;
            padding: 7px 11px;
            background: var(--bg-card-sec);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            font-family: 'JetBrains Mono', system-ui, sans-serif;
            cursor: pointer;
            touch-action: manipulation;
            user-select: none;
            transition: background-color 0.15s, transform 0.1s;
        }

        .quick-btn:active {
            transform: scale(0.92);
            background: var(--primary);
            color: #ffffff;
        }

        .quick-btn.btn-action {
            color: #f87171;
            background: rgba(239, 68, 68, 0.12);
            border-color: rgba(239, 68, 68, 0.25);
        }

        /* 可折叠 AST 语法树样式 */
        .ast-collapsible {
            margin-top: 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-card-sec);
            overflow: hidden;
            transition: all 0.2s ease;
        }

        .ast-collapsible summary {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 9px 12px;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
            cursor: pointer;
            user-select: none;
            list-style: none;
            touch-action: manipulation;
        }

        .ast-collapsible summary::-webkit-details-marker {
            display: none;
        }

        .ast-collapsible summary .collapse-icon {
            font-size: 0.75rem;
            color: var(--text-muted);
            transition: transform 0.2s ease;
        }

        .ast-collapsible[open] summary .collapse-icon {
            transform: rotate(180deg);
        }

        .ast-collapsible .output-box {
            margin: 0;
            border-top: 1px solid var(--border);
            border-radius: 0 0 8px 8px;
            max-height: 220px;
            background: #0f172a;
            color: #a78bfa;
            padding: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            word-wrap: break-word;
            white-space: pre-wrap;
            overflow-y: auto;
        }

        /* 计算按钮 */
        .calc-primary-btn {
            width: 100%;
            margin-top: 14px;
            padding: 13px 18px;
            background: linear-gradient(135deg, #38bdf8, #2563eb);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            touch-action: manipulation;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
            transition: transform 0.15s, opacity 0.15s;
        }

        .calc-primary-btn:active {
            transform: scale(0.98);
            opacity: 0.92;
        }

        /* 复制按钮 */
        .copy-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            touch-action: manipulation;
        }

        .copy-btn:active {
            color: var(--primary);
            border-color: var(--primary);
        }

        /* 推导步骤容器 */
        .steps-wrapper {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 6px;
        }

        .step-item {
            background: var(--bg-card-sec);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
        }

        .step-item-title {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 500;
        }

        .step-math {
            background: #0f172a !important;
            color: #38bdf8 !important;
            border: 1px solid #334155 !important;
            border-radius: 6px;
            min-height: 44px;
            font-size: 1.15rem;
            padding: 6px 10px;
            overflow-x: auto;
        }

        /* 简单轻量 Toast */
        .toast {
            position: fixed;
            bottom: calc(30px + var(--safe-bottom));
            left: 50%;
            transform: translateX(-50%) translateY(50px);
            background: rgba(15, 23, 42, 0.95);
            color: #f8fafc;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            border: 1px solid #475569;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
            pointer-events: none;
            opacity: 0;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 999;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>

<body>

    <!-- 移动端顶部标题栏 -->
    <header class="mobile-header">
        <a href="index.html" class="header-brand">
            <div class="brand-badge"><i class="fa-solid fa-arrow-left"></i></div>
            <span>科学微积分计算器</span>
        </a>
        <button class="h-btn" id="themeToggleBtn" title="切换主题">🌙</button>
    </header>

    <div class="container">
        <div class="card">
            <div class="section-label">
                <span>公式输入</span>
                <span style="font-size: 0.75rem; color: var(--primary);">支持拖拽与触控输入</span>
            </div>

            <!-- 公式输入框（开启自动移动端虚拟键盘支持） -->
            <math-field id="myMathInput" math-virtual-keyboard-policy="auto"></math-field>

            <!-- 移动端快捷数学键栏 -->
            <div class="quick-toolbar-wrapper">
                <div class="quick-toolbar" id="quickToolbar">
                    <button class="quick-btn" data-insert="\int #0 \,dx">∫ dx</button>
                    <button class="quick-btn" data-insert="\frac{d}{dx}\left(#0\right)">d/dx</button>
                    <button class="quick-btn" data-insert="\frac{#0}{#?}">a/b</button>
                    <button class="quick-btn" data-insert="\sqrt{#0}">√x</button>
                    <button class="quick-btn" data-insert="{#0}^{2}">x²</button>
                    <button class="quick-btn" data-insert="{#0}^{#?}">xⁿ</button>
                    <button class="quick-btn" data-insert="\sin\left(#0\right)">sin</button>
                    <button class="quick-btn" data-insert="\cos\left(#0\right)">cos</button>
                    <button class="quick-btn" data-insert="\tan\left(#0\right)">tan</button>
                    <button class="quick-btn" data-insert="\ln\left(#0\right)">ln</button>
                    <button class="quick-btn" data-insert="e^{#0}">eˣ</button>
                    <button class="quick-btn" data-insert="\pi">π</button>
                    <button class="quick-btn" data-insert="\infty">∞</button>
                    <button class="quick-btn" data-insert="+">+</button>
                    <button class="quick-btn" data-insert="-">−</button>
                    <button class="quick-btn" data-insert="\times">×</button>
                    <button class="quick-btn" data-insert="\div">÷</button>
                    <button class="quick-btn btn-action" id="btnClear">AC</button>
                    <button class="quick-btn btn-action" id="btnBackspace">⌫</button>
                </div>
            </div>

            <!-- 可折叠 AST 语法树结构展示区 -->
            <details class="ast-collapsible">
                <summary>
                    <span>AST 语法树结构 (MathJSON)</span>
                    <span class="collapse-icon">▼</span>
                </summary>
                <div class="output-box" id="ASTOutput">Loading...</div>
            </details>

            <!-- 计算触发按钮 -->
            <button id="calcBtn" class="calc-primary-btn">
                <i class="fa-solid fa-bolt"></i> 开始分步计算
            </button>
        </div>

        <!-- 最终计算结果 -->
        <div class="card">
            <div class="section-label">
                <span>最终计算结果</span>
                <button class="copy-btn" id="copyResultBtn"><i class="fa-regular fa-copy"></i> 复制 LaTeX</button>
            </div>
            <math-field id="resultOutput" readonly class="step-math" style="min-height: 52px; font-size: 1.35rem; color: #38bdf8;">等待计算...</math-field>
        </div>

        <!-- 函数图像与几何特征 -->
        <div class="card">
            <div class="section-label">
                <span>函数图像与几何特征</span>
                <span style="font-size: 0.75rem; color: var(--text-muted);">单指拖动 / 双指缩放</span>
            </div>
            <div id="graphContainer" style="margin-top: 4px;"></div>
        </div>

        <!-- 推导步骤展示 -->
        <div class="card">
            <div class="section-label">
                <span>推导步骤</span>
            </div>
            <div id="stepsContainer" class="steps-wrapper">
                <div style="font-size: 0.85rem; color: var(--text-muted); padding: 8px 0;">点击上方“开始分步计算”查看完整微积分推导流程</div>
            </div>
        </div>
    </div>

    <!-- 复制提示 Toast -->
    <div id="toast" class="toast">已复制到剪贴板</div>

    <!-- 使用 ES Module 现代模块化方式引入 -->
    <script type="module">
        import { MathfieldElement } from 'https://unpkg.com/mathlive?module';
        import { ComputeEngine } from 'https://unpkg.com/@cortex-js/compute-engine?module';
        import { routeCalculation } from './router.js';
        import { InteractiveGrapher } from './grapher.js';

        const mathInput = document.getElementById('myMathInput');
        const ASTOutput = document.getElementById('ASTOutput');
        const calcBtn = document.getElementById('calcBtn');
        const resultOutput = document.getElementById('resultOutput');
        const stepsContainer = document.getElementById('stepsContainer');
        const copyResultBtn = document.getElementById('copyResultBtn');
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const toast = document.getElementById('toast');
        const grapher = new InteractiveGrapher('graphContainer');

        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // 主题切换
        function updateThemeIcon(t) {
            if (themeToggleBtn) {
                themeToggleBtn.innerHTML = t === 'dark' ? '☀️' : '🌙';
            }
        }

        const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
        updateThemeIcon(currentTheme);

        themeToggleBtn.addEventListener('click', () => {
            const cur = document.documentElement.getAttribute('data-theme') || 'dark';
            const next = cur === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            try { localStorage.setItem('flowermuyi_theme', next); } catch (e) { }
            updateThemeIcon(next);
        });

        // 移动端快捷符号点击插入
        document.querySelectorAll('.quick-btn[data-insert]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                const latex = btn.getAttribute('data-insert');
                mathInput.focus();
                mathInput.executeCommand(['insert', latex]);
            });
        });

        // 清空与退格
        document.getElementById('btnClear').addEventListener('click', (e) => {
            e.preventDefault();
            mathInput.setValue('');
            mathInput.focus();
        });

        document.getElementById('btnBackspace').addEventListener('click', (e) => {
            e.preventDefault();
            mathInput.focus();
            mathInput.executeCommand('deleteBackward');
        });

        // 复制计算结果 LaTeX
        copyResultBtn.addEventListener('click', async () => {
            const val = resultOutput.value;
            if (!val || val === '等待计算...' || val === '请输入有效的公式') {
                showToast('暂无可复制的结果');
                return;
            }
            try {
                await navigator.clipboard.writeText(val);
                showToast('已复制 LaTeX 公式');
            } catch (e) {
                showToast('复制失败，请手动长按复制');
            }
        });

        try {
            const ce = new ComputeEngine();
            MathfieldElement.computeEngine = ce;

            function updateAST() {
                let mathJSON;
                if (mathInput.expression && mathInput.expression.json) {
                    mathJSON = mathInput.expression.json;
                } else {
                    mathJSON = mathInput.getValue('math-json');
                }

                if (typeof mathJSON === 'string') {
                    try { mathJSON = JSON.parse(mathJSON); } catch (e) { }
                }

                ASTOutput.textContent = JSON.stringify(mathJSON, null, 2);
            }

            mathInput.addEventListener('input', updateAST);
            mathInput.addEventListener('DOMContentLoaded', updateAST);

            if (mathInput.expression) {
                updateAST();
            } else {
                setTimeout(updateAST, 300);
            }

            // 计算与渲染逻辑
            calcBtn.addEventListener('click', () => {
                const currentAST = mathInput.expression ? mathInput.expression.json : null;
                if (!currentAST) {
                    resultOutput.value = "请输入有效的公式";
                    return;
                }

                // 调用路由器分发任务
                const output = routeCalculation(currentAST, ce);

                // 渲染最终结果
                resultOutput.value = output.resultLatex;

                // 动态生成可视化的推导步骤
                stepsContainer.innerHTML = '';
                if (output.steps && output.steps.length > 0) {
                    output.steps.forEach(step => {
                        const item = document.createElement('div');
                        item.className = 'step-item';

                        const label = document.createElement('div');
                        label.className = 'step-item-title';
                        label.textContent = step.title;

                        const stepField = document.createElement('math-field');
                        stepField.setAttribute('readonly', '');
                        stepField.className = 'step-math';
                        stepField.value = step.latex;

                        item.appendChild(label);
                        item.appendChild(stepField);
                        stepsContainer.appendChild(item);
                    });
                } else {
                    stepsContainer.innerHTML = '<div style="font-size: 0.85rem; color: var(--text-muted); padding: 8px 0;">已直接计算出最终结果</div>';
                }

                // 联动更新 2D 交互画布
                if (output.plotData) {
                    grapher.setData(output.plotData);
                } else {
                    grapher.setData(null);
                }
            });

        } catch (error) {
            ASTOutput.textContent = "脚本运行中断：\n" + error.message;
            grapher.setData(null);
        }
    </script>

</body>

</html>
