<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowerMUYi Navigation Portal | 正在定位页面</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <style>
        :root {
            --bg: #0b0f19;
            --card-bg: #161f30;
            --card-border: #23324a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
        }
        [data-theme="light"] {
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --card-border: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary: #2563eb;
        }
        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            transition: background-color 0.3s, color 0.3s;
        }
        .loader-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid var(--card-border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            max-width: 420px;
            width: 90%;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(59, 130, 246, 0.2);
            border-left-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h2 { margin: 0 0 10px 0; font-size: 1.4rem; color: var(--primary); }
        p { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 24px; }
        .lang-btn {
            padding: 10px 20px;
            background: var(--primary);
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
        }
    </style>
    <script>
        (function() {
            try {
                localStorage.removeItem('preferred_lang');
            } catch(e) {}
            var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            var savedTheme = localStorage.getItem('flowermuyi_theme');
            var currentTheme = savedTheme || (systemDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', currentTheme);

            var path = window.location.pathname;
            // 处理历史遗留的 /cn/ 或 /en/ 路径
            if (path.indexOf('/cn/') !== -1) {
                var target = path.replace('/cn/', '/pc/');
                window.location.replace(target);
                return;
            }
            if (path.indexOf('/en/') !== -1) {
                var target = path.replace('/en/', '/pc/');
                window.location.replace(target);
                return;
            }
            
            // 默认回退至电脑端工作台首页
            window.location.replace('/pc/index.html');
        })();
    </script>
</head>
<body>
    <div class="loader-card">
        <div class="spinner"></div>
        <h2>FlowerMUYi 导航工作台</h2>
        <p>正在为您跳转至目标页面...</p>
        <a href="/pc/index.html" class="lang-btn">前往工作台首页</a>
    </div>
</body>
</html>
