<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowerMUYi Navigation Portal | 导航工作台</title>
    <meta name="description" content="FlowerMUYi Personal Navigation Portal - EdgeTunnel, IP Quality & Threat Intelligence Detection, About Us.">
    <meta http-equiv="refresh" content="0; url=./pc/index.html">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <style>
        :root {
            --bg: #0b0f19;
            --card-bg: #161f30;
            --card-border: #23324a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --btn-bg: #23324a;
        }
        [data-theme="light"] {
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --card-border: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary: #2563eb;
            --btn-bg: #e2e8f0;
        }
        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            transition: background-color 0.3s, color 0.3s;
        }
        .loader-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid var(--card-border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            max-width: 400px;
            width: 90%;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(59, 130, 246, 0.2);
            border-left-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h2 { margin: 0 0 10px 0; font-size: 1.4rem; background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 24px; }
        .lang-links { display: flex; gap: 12px; justify-content: center; }
        .lang-btn {
            padding: 10px 20px;
            background: var(--primary);
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .lang-btn:hover { opacity: 0.9; }
    </style>
    <script>
        (function() {
            try {
                localStorage.removeItem('preferred_lang');
            } catch (e) {}

            // 识别系统或既有白天/黑夜模式偏好
            var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            var savedTheme = localStorage.getItem('flowermuyi_theme');
            var currentTheme = savedTheme || (systemDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', currentTheme);
            if (!savedTheme) {
                try {
                    localStorage.setItem('flowermuyi_theme', currentTheme);
                } catch(e) {}
            }

            var ua = navigator.userAgent;
            var navPlatform = (navigator.platform || '').toLowerCase();
            var minDim = Math.min(window.screen.width, window.screen.height);
            var maxTouchPoints = navigator.maxTouchPoints || navigator.msMaxTouchPoints || 0;
            var isTouch = ('ontouchstart' in window) || (maxTouchPoints > 0);

            // 平板设备 (iPad / Android Tablet)
            var isIPad = /iPad/i.test(ua) || (navPlatform.includes('mac') && maxTouchPoints > 1);
            var isAndroidTablet = /Android/i.test(ua) && (!/Mobile/i.test(ua) || /Tablet/i.test(ua));
            var isTablet = isIPad || isAndroidTablet || /Tablet|PlayBook|Silk|Kindle|SM-T/i.test(ua) || (isTouch && minDim >= 600 && minDim <= 1024);

            // 手机设备 (iPhone / Android Phone)
            var isMobile = /Mobile|iPhone|iPod|Android.*Mobile|Windows Phone/i.test(ua) || (isTouch && minDim < 600);

            // 当前电脑端主站位于 ./pc/，手机端 (./mobile/) 与平板端 (./tablet/) 预留就绪
            window.location.replace('./pc/index.html');
        })();
    </script>
</head>
<body>
    <div class="loader-card">
        <div class="spinner"></div>
        <h2>FlowerMUYi 导航工作台</h2>
        <p>正在前往工作台首页...</p>
        <div class="lang-links">
            <a href="./pc/index.html" class="lang-btn">进入电脑端工作台</a>
        </div>
    </div>
</body>
</html>
